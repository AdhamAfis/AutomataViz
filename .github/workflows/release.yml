name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package
        
      - name: Check core algorithms
        run: |
          java -ea -Djava.awt.headless=true -cp "target/test-classes:target/*" com.dfavisualizer.algorithm.LearningRegexCheck
          java -ea -Djava.awt.headless=true -cp "target/test-classes:target/*" com.dfavisualizer.algorithm.RegexAlternativesCheck
        
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: AutomataViz ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: target/AutomataViz-*-jar-with-dependencies.jar
