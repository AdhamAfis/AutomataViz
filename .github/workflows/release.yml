name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - pom.xml
      - CHANGELOG.md
      - scripts/release.py
      - scripts/test_release.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release helper
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Read version from pom.xml
        id: metadata
        run: python3 scripts/release.py metadata
      - name: Check release state
        if: steps.metadata.outputs.publish == 'true'
        id: state
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.error"; then
            if [ "$(jq -r '.draft' "$RUNNER_TEMP/release.json")" = false ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is already published; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            case "$(cat "$RUNNER_TEMP/release.error")" in
              *"HTTP 404"*) echo "draft=false" >> "$GITHUB_OUTPUT" ;;
              *) cat "$RUNNER_TEMP/release.error" >&2; exit 1 ;;
            esac
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "Existing tag points to another commit. Retry using the tag ref; tags are never moved." >&2
              exit 1
            }
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        if: steps.state.outputs.publish == 'true'
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Build and check the release
        if: steps.state.outputs.publish == 'true'
        run: |
          mvn --batch-mode --no-transfer-progress clean package
          for check in LearningRegexCheck RegexAlternativesCheck ConstructionTraceCheck LearningExamplesCheck; do
            java -ea -Djava.awt.headless=true -cp "target/test-classes:target/*" "com.dfavisualizer.algorithm.$check"
          done
      - name: Prepare JAR, checksums, instructions and notes
        if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: python3 scripts/release.py package "$VERSION"
      - name: Tag the verified commit
        if: steps.state.outputs.publish == 'true'
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Publish complete release
        if: steps.state.outputs.publish == 'true'
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          EXISTING_DRAFT: ${{ steps.state.outputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EXISTING_DRAFT" != true ]; then
            options=()
            if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "AutomataViz $TAG" \
              --generate-notes --notes-file release/RELEASE_NOTES.md "${options[@]}"
          fi
          # Only incomplete drafts may have their assets replaced on retry.
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          gh release upload "$TAG" "release/AutomataViz-$VERSION-jar-with-dependencies.jar" release/SHA256SUMS.txt release/README.txt --clobber
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
